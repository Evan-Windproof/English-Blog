name: Build and test English blog
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish this main build to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-blog.txt
      - run: python scripts/build_blog.py
      - run: python -m unittest discover -s tests
      - name: Stage static site
        run: bash scripts/stage_pages.sh "$RUNNER_TEMP/site"
      - name: Run browser regression tests
        run: |
          npm install --prefix "$RUNNER_TEMP/blog-tests" --no-save --package-lock=false playwright@1.58.2
          export NODE_PATH="$RUNNER_TEMP/blog-tests/node_modules"
          node "$NODE_PATH/playwright/cli.js" install --with-deps chromium
          export CHROMIUM_PATH
          CHROMIUM_PATH=$(node -p "require('playwright').chromium.executablePath()")
          mkdir -p work
          python -m http.server 8000 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --silent --retry 5 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/ -o /dev/null
          for test in tests/*.cjs; do
            node "$test"
          done
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: english-github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
